server:
  port: 8085

spring:
  application:
    name: darlink-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/darlink_db
    username: postgres
    password: "${DB_PASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: DarLinkHikariCP
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Configuration JWT (V4)
darlink:
  jwt:
    secret: "darlink-prestige-real-estate-secret-key-super-secure-2026-min-256-bits"
    expiration-ms: 86400000 # 24 heures

# Documentation Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
