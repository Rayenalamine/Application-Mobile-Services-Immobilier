spring:
  datasource:
    url: jdbc:h2:mem:darlink_test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false

darlink:
  jwt:
    secret: "darlink-prestige-real-estate-secret-key-super-secure-2026-min-256-bits"
    expiration-ms: 3600000
